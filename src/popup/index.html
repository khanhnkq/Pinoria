<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinoria Settings</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand-header">
        <img class="brand-mark" src="/icons/icon-48.png" width="52" height="52" alt="" aria-hidden="true" />
        <div class="header-copy">
          <h1>Pinoria</h1>
          <p>Configure download buttons</p>
        </div>
      </header>

      <form id="settings-form">
        <div class="section-heading">
          <label id="targets-label">Folders &amp; download colors</label>
          <span id="target-limit"></span>
        </div>
        <ul id="targets-list" aria-labelledby="targets-label"></ul>

        <button id="add-target" class="add-button" type="button">
          <span class="add-icon" aria-hidden="true">＋</span>
          <span>Add folder</span>
        </button>

        <p class="hint">
          Every destination lives inside Downloads and automatically separates images, videos and GIFs.
        </p>

        <button class="primary-button" type="submit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5V4Zm3 0v6h8V4M8 20v-7h8v7" /></svg>
          <span class="button-label">Save settings</span>
        </button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
