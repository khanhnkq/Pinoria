<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cài đặt Pinoria</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header>
        <img class="brand-mark" src="/icons/icon-48.png" width="40" height="40" alt="" aria-hidden="true" />
        <div class="header-copy">
          <h1>Phân loại tải xuống</h1>
          <p>Mỗi màu tương ứng với một folder.</p>
        </div>
      </header>

      <form id="settings-form">
        <div class="section-heading">
          <label id="targets-label">Folder &amp; màu nút</label>
          <span id="target-limit"></span>
        </div>
        <ul id="targets-list" aria-labelledby="targets-label"></ul>

        <button id="add-target" class="secondary-button" type="button">
          <span aria-hidden="true">＋</span> Thêm folder
        </button>

        <p class="hint">
          Đường dẫn nằm trong Downloads, ví dụ Pinterest/Kim Ji Won. Mỗi folder tự phân loại thành Ảnh, Video và GIF.
        </p>

        <button class="primary-button" type="submit">Lưu các nút tải</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
